<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Heading}}</title></head>
<body style="margin:0;padding:0;background:#ffffff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;">
<tr><td align="center" style="padding:18px;">
<table role="presentation" width="420" cellpadding="0" cellspacing="0" style="width:100%;max-width:420px;color:#222222;font:14px/1.45 -apple-system,Helvetica,Arial,sans-serif;">
<tr><td>
<h1 style="margin:0 0 6px;font-size:17px;">{{.Heading}}</h1>
<div style="color:#555555;">These people just joined {{.Meta}}. A hello from you goes a long way.</div>
{{range .Lines}}<div style="padding:9px 0;border-bottom:1px solid #eeeeee;">
<a href="{{.URL}}" style="color:#1144cc;text-decoration:none;font-weight:600;">{{.Name}}</a>
</div>
{{end}}<div style="text-align:center;"><a href="{{.MagazineURL}}" style="display:inline-block;background:#1144cc;color:#ffffff;padding:7px 12px;border-radius:4px;font-size:13px;margin-top:10px;text-decoration:none;">Say hello</a></div>
<div style="margin-top:14px;color:#999999;font-size:11px;text-align:center;">You get this because you're one of the members of {{.Meta}} who welcomes new people.<br><a href="{{.Unsubscribe}}" style="color:#999999;">Unsubscribe from welcome emails</a></div>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
